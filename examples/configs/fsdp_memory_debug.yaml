# FSDP Memory Debugging Configuration Example
# This configuration enables memory visualization and debugging features

# Model and training configuration
optimizer: "adam"
lr: 2e-5
lr_decay_style: "constant"
weight_decay: 0.0
adam_beta1: 0.9
adam_beta2: 0.95
adam_eps: 1e-8
warmup_ratio: 0.03

# Weight update configuration
update_weights_bucket_size: 536870912  # 512MB in bytes

# Model configuration
attn_implementation: "flash_attention_2"
gradient_checkpointing: false

# Memory debugging configuration
enable_memory_visualize: true
memory_snapshot_out_dir: "./memory_debug_snapshots"
memory_snapshot_interval: 50  # Dump snapshot every 50 training steps

# Logging configuration
wandb_project: "slime-fsdp-memory-debug"
wandb_run_name: "memory_debugging_run"